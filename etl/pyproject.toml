[project]
name = "radar-etl"
version = "1.0.0"
description = "ETL do Radar Macro Brasil: coleta séries públicas do BCB e do IBGE, calcula insights por regras e publica um snapshot JSON validado."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
radar-etl = "radar_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 ignorado: o formatter (ruff format) já quebra o código; sobram só textos longos em pt-BR, que não são quebrados.
ignore = ["E501"]
